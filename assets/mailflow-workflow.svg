<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">MailFlow CLI workflow</title>
  <desc id="desc">Workflow from terminal input through validation and an authorized email API to a status panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090812"/><stop offset="1" stop-color="#1d1230"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#211a38"/><stop offset="1" stop-color="#120f20"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#c084fc"/></marker>
  </defs>
  <rect width="1400" height="560" rx="26" fill="url(#bg)"/>
  <text x="70" y="76" fill="#faf5ff" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">How MailFlow CLI works</text>
  <text x="70" y="112" fill="#c4b5fd" font-family="Arial, Helvetica, sans-serif" font-size="19">A controlled one-request workflow for authorized email API testing</text>
  <g filter="url(#shadow)">
    <rect x="65" y="180" width="250" height="220" rx="18" fill="url(#card)" stroke="#7c3aed" stroke-width="2"/>
    <rect x="375" y="180" width="250" height="220" rx="18" fill="url(#card)" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="685" y="180" width="250" height="220" rx="18" fill="url(#card)" stroke="#a855f7" stroke-width="2"/>
    <rect x="995" y="180" width="340" height="220" rx="18" fill="url(#card)" stroke="#d946ef" stroke-width="2"/>
  </g>
  <g fill="none" stroke="#c084fc" stroke-width="3" marker-end="url(#arrow)"><path d="M315 290h52"/><path d="M625 290h52"/><path d="M935 290h52"/></g>
  <g font-family="Arial, Helvetica, sans-serif">
    <circle cx="115" cy="230" r="27" fill="#7c3aed"/><text x="106" y="239" fill="white" font-size="25" font-weight="700">1</text>
    <text x="165" y="238" fill="#f5f3ff" font-size="24" font-weight="700">Input</text>
    <text x="92" y="292" fill="#ddd6fe" font-size="17">Destination email</text><text x="92" y="320" fill="#ddd6fe" font-size="17">Sender name</text><text x="92" y="348" fill="#ddd6fe" font-size="17">Subject and message</text>
    <circle cx="425" cy="230" r="27" fill="#8b5cf6"/><text x="416" y="239" fill="white" font-size="25" font-weight="700">2</text>
    <text x="475" y="238" fill="#f5f3ff" font-size="24" font-weight="700">Validate</text>
    <text x="402" y="292" fill="#ddd6fe" font-size="17">Email format check</text><text x="402" y="320" fill="#ddd6fe" font-size="17">Required fields</text><text x="402" y="348" fill="#ddd6fe" font-size="17">Message length limit</text>
    <circle cx="735" cy="230" r="27" fill="#a855f7"/><text x="726" y="239" fill="white" font-size="25" font-weight="700">3</text>
    <text x="785" y="238" fill="#f5f3ff" font-size="24" font-weight="700">Request</text>
    <text x="712" y="292" fill="#ddd6fe" font-size="17">Form-encoded payload</text><text x="712" y="320" fill="#ddd6fe" font-size="17">Configured endpoint</text><text x="712" y="348" fill="#ddd6fe" font-size="17">Timeout protection</text>
    <circle cx="1045" cy="230" r="27" fill="#d946ef"/><text x="1036" y="239" fill="white" font-size="25" font-weight="700">4</text>
    <text x="1095" y="238" fill="#f5f3ff" font-size="24" font-weight="700">Status panel</text>
    <text x="1022" y="292" fill="#ddd6fe" font-size="17">HTTP status code</text><text x="1022" y="320" fill="#ddd6fe" font-size="17">Bounded server reply</text><text x="1022" y="348" fill="#ddd6fe" font-size="17">Accepted or rejected</text>
  </g>
  <rect x="65" y="455" width="1270" height="54" rx="12" fill="#120f20" stroke="#4c3a70"/>
  <text x="90" y="490" fill="#f0abfc" font-family="monospace" font-size="18">No automatic POST retries • timeout-safe network call • authorized-use only</text>
</svg>
