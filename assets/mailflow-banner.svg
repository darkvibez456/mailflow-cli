<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">MailFlow CLI Mail banner</title>
  <desc id="desc">MailFlow CLI Mail, an authorized educational email tool.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090f"/>
      <stop offset="0.55" stop-color="#15102c"/>
      <stop offset="1" stop-color="#2a0c2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="20%" r="70%">
      <stop offset="0" stop-color="#a855f7" stop-opacity=".45"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1400" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1400" height="420" rx="28" fill="url(#glow)"/>
  <path d="M0 338 C240 280 350 390 610 320 S1010 260 1400 330" fill="none" stroke="#7c3aed" stroke-opacity=".35" stroke-width="2"/>
  <path d="M0 360 C260 300 400 410 680 340 S1080 290 1400 350" fill="none" stroke="#ec4899" stroke-opacity=".25" stroke-width="2"/>
  <g transform="translate(88 92)" filter="url(#shadow)">
    <rect width="104" height="104" rx="26" fill="#a855f7" fill-opacity=".18" stroke="#c084fc" stroke-width="2"/>
    <path d="M26 38h52v38H26z" fill="none" stroke="#f5d0fe" stroke-width="5"/>
    <path d="m29 42 23 18 23-18" fill="none" stroke="#f5d0fe" stroke-width="5"/>
    <path d="M42 86h20" stroke="#f5d0fe" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="230" y="160" fill="#faf5ff" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" letter-spacing="5">MAILFLOW CLI</text>
  <text x="234" y="215" fill="#d8b4fe" font-family="Arial, Helvetica, sans-serif" font-size="26" letter-spacing="3">AUTHORIZED EMAIL TESTING TOOL</text>
  <text x="234" y="278" fill="#e9d5ff" font-family="Arial, Helvetica, sans-serif" font-size="22">Clean terminal workflow • validation • timeout-safe requests</text>
  <circle cx="1250" cy="95" r="5" fill="#f0abfc"/><circle cx="1280" cy="125" r="3" fill="#c084fc"/><circle cx="1210" cy="145" r="3" fill="#f0abfc"/>
  <text x="234" y="355" fill="#a78bfa" font-family="monospace" font-size="18">mailflow_mail.py</text>
</svg>
